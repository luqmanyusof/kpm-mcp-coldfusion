# Continue config for the course. Copy to  %USERPROFILE%\.continue\config.yaml  (day1.md, Topic 7.3).
# Ollama Cloud models run through the Ollama app on your laptop (after `ollama signin`) - no key here.
# Token Harbor needs a key: it is read from  %USERPROFILE%\.continue\.env  (TOKEN_HARBOR_API_KEY=...),
# so the key itself is never written in this file.
name: MCP Course
version: 1.0.0
schema: v1

models:
  - name: "gpt-oss 20B (Ollama Cloud free)"
    provider: openai
    model: gpt-oss:20b
    apiBase: https://ollama.com/v1
    apiKey: ganti dengan api key
    roles:
      - chat
      - edit

  - name: "Gemma 4 31B (Ollama Cloud free)"
    provider: openai
    model: gemma4:31b
    apiBase: https://ollama.com/v1
    apiKey: ganti dengan api key
    roles:
      - chat
      - edit
